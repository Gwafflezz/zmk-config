# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # raw_hid_adapter goes on the central half only (left) — it carries the live
  # layer events the overlay listens to. No studio snippet: the overlay reads
  # the keymap from corne.keymap locally, not from the device.
  - board: nice_nano_v2
    shield: corne_left raw_hid_adapter
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: corne_right
  # TEMPORARIO (diagnostico de bateria): mesma metade esquerda, mas sem o snippet do
  # Studio (ele disputa o CDC ACM com o log) e com log USB ligado -- ZMK_USB_LOGGING ja
  # sobe o ZMK_LOG_LEVEL para debug. Flashar, abrir `tio /dev/ttyACM0` e ler a linha do
  # battery_nrf_vddh: "ADC raw %d ~ %d mV => %d%%". Remover esta entrada depois.
  - board: nice_nano_v2
    shield: corne_left raw_hid_adapter
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
    artifact-name: corne_left_debug
  # Escotilha de emergencia: apaga o NVS da metade em que for flashado (inclusive o
  # estado "ext power off" que deixa o OLED apagado) -- derruba tambem os pareamentos
  # BLE, entao depois e' preciso reflashar o firmware normal e reparear as duas metades.
  - board: nice_nano_v2
    shield: settings_reset
