# RGB Underglow (driver habilitado para enviar sinal de desligar para todos os 27 leds no boot)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Enable Corne OLED Display & Battery Status
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y

# Power Management & Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

# Enable mouse emulation
CONFIG_ZMK_POINTING=y

# Live layer events over Raw HID for the Corne layer overlay (tools/).
CONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y
CONFIG_ZMK_STUDIO=y
