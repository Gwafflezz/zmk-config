# RGB per-key: driver ligado, fita apagada no boot; acende com &rgb_ug RGB_TOG
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Sem acoplar o ext power ao RGB (ver CONFIG_ZMK_EXT_POWER abaixo).
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enable Corne OLED Display & Battery Status
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# TESTE CONCLUIDO EM 2026-09-02: a polaridade invertida (P0.13 GPIO_ACTIVE_LOW) FALHOU.
# Gravado o firmware de 9f9eb10, o OLED acendeu no flash e apagou assim que o ZMK assumiu,
# nas duas metades, junto com os WS2812; o teclado seguiu digitando (o rail cortado e' o
# de perifericos, nao o do MCU). Ou seja, nenhuma das duas polaridades de P0.13 mantem o
# VCC ligado neste clone SuperMini: com ACTIVE_HIGH o VCC caia ao habilitar, com
# ACTIVE_LOW cai ao assumir o pino. Sem driver de ext power o bootloader deixa o VCC
# alimentado e o display fica de pe'.
# Custo aceito: sem corte de VCC no deep sleep, os 21 WS2812 ficam com corrente de
# repouso (~15-20 mA parado). Nao reabrir sem medir o MOSFET na placa -- o proximo teste
# as cegas custa outro ciclo de flash das duas metades.
CONFIG_ZMK_EXT_POWER=n
# Blank de idle de volta no default (y para SSD1306): o OLED apaga apos
# ZMK_IDLE_TIMEOUT e volta ao primeiro toque.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Power Management & Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable mouse emulation
CONFIG_ZMK_POINTING=y

# Live layer events over Raw HID for the Corne layer overlay (tools/).
CONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y
CONFIG_ZMK_STUDIO=y
